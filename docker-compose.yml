services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintech-wallet-backend
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_NAME: "Fintech Wallet"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fintech_wallet
      DB_USERNAME: fintech_wallet
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech-wallet-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: fintech-wallet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fintech_wallet
      POSTGRES_USER: fintech_wallet
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech_wallet -d fintech_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
